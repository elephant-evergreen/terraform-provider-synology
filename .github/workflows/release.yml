name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and notes
        id: notes
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::Use a vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N release tag."
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]]; then
            echo "::error::Create an annotated tag with git tag -a."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag a reviewed commit on main."
            exit 1
          fi
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes" ]] ||
             [[ ! "$(awk 'NF { print; exit }' "$notes")" =~ ^'## '(Upgrade\ notes|Breaking\ changes)$ ]] ||
             [[ "$(awk 'NF { count++ } END { print count+0 }' "$notes")" -lt 2 ]]; then
            echo "::error::Add release notes at $notes starting with Upgrade notes or Breaking changes."
            exit 1
          fi
          printf 'path=%s\n' "$notes" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.11.6
      - run: mise run check
      - name: Import release signing key
        id: signing
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: v2.20.0
          args: release --clean --parallelism 2 --release-notes=${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
