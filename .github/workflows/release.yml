name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bin/release check-tag "$GITHUB_REF_NAME"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: 2026.11.0
      - run: mise run check
      - name: Import release signing key
        id: signing
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          version: v2.20.0
          args: release --clean --parallelism 2 --skip=publish,announce
        env:
          GPG_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
      - name: Verify and publish signed release
        run: bin/release publish "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Registry installation
        run: mise exec -- bin/release verify-registry "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
